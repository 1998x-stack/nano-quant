[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-quant"
version = "0.1.0"
description = "Reproducible quantitative finance research framework (pre-v1.0)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - no license grant"}
authors = [{name = "nano-quant contributors"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
nano-quant = "nano_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
files = ["src/nano_quant"]
check_untyped_defs = true
warn_unused_ignores = true
