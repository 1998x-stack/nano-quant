name: CI

on:
  push:
    branches: [main, "feature/**", "module/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install editable package
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src/nano_quant
      - name: Tests with coverage
        run: python -m pytest -q --cov=nano_quant --cov-report=term-missing --cov-fail-under=85
      - name: Phase B golden smoke regression
        run: python -m nano_quant.cli smoke --config examples/phase_b_golden.json
      - name: Phase C synthetic research backtest
        run: python -m nano_quant.cli backtest --config examples/daily_equity_v1.json --output-dir reports/ci-daily
      - name: Assert research artifacts
        run: python -c "from pathlib import Path; p=Path('reports/ci-daily'); assert all((p/n).is_file() for n in ('run-manifest.json','metrics.json','equity-curve.csv','trade-ledger.csv','rejections.csv'))"
      - name: Phase D evidence and synthetic validation audit
        run: python -m nano_quant.cli validate --config examples/daily_equity_v1.json --output reports/validation/audit.json
      - name: Assert validation artifact explicitly disclaims alpha
        run: python -c "import json; from pathlib import Path; d=json.loads(Path('reports/validation/audit.json').read_text()); assert d['phase']=='D' and d['trained_model'] is False and d['out_of_sample_model_results'] is False and d['cost_sensitivity']['comparison'] in ('PASS','INCOMPARABLE_DIFFERENT_TRADE_PATH')"
