name: CI

on:
  push:
    branches: [main, "feature/**", "module/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install editable package
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src/nano_quant
      - name: Tests with coverage
        run: python -m pytest -q --cov=nano_quant --cov-report=term-missing --cov-fail-under=85
      - name: Phase B CLI golden smoke
        run: python -m nano_quant.cli smoke --config examples/phase_b_golden.json
